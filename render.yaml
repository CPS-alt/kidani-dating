services:
  - type: web
    name: kidani-dating
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kidani-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: kidani-postgres
    databaseName: kidani
    user: kidani
    plan: basic-256mb
    region: singapore
